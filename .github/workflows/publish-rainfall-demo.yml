name: publish rainfall demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-rainfall-demo.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install 'numpy>=2,<3'
      - name: retrieve completed national CHIRPS baseline
        run: gh run download 34862522613 -n chirps-1991-2020 -D /tmp/chirps-baseline
        env:
          GH_TOKEN: ${{ github.token }}
      - name: retrieve Madagascar place names
        run: curl -fLsS --retry 3 https://download.geonames.org/export/dump/MG.zip -o /tmp/MG.zip
      - name: generate static data
        run: python -m pipeline.publish_rainfall --baseline /tmp/chirps-baseline/chirps-1991-2020.npz --gazetteer /tmp/MG.zip --output data
      - run: npm run check
      - run: npm run build
      - name: commit versioned data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Publish national CHIRPS rainfall tiles and place index"
            git push origin HEAD:main
          fi
      - name: deploy static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
