name: ERA5-Land Madagascar split quarter benchmark

on:
  workflow_dispatch:
    inputs:
      year:
        description: ERA5-Land year to download
        required: true
        default: "2020"
  push:
    branches: [main]
    paths:
      - ".github/workflows/era5-grid-year.yml"
      - "pipeline/era5_download_period.py"
      - "pipeline/sources.py"

permissions:
  contents: read

jobs:
  download:
    name: Q1 ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - statistic: daily_minimum
            label: minimum
            slug: minimum
          - statistic: daily_maximum
            label: maximum
            slug: maximum
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install CDS downloader
        run: python -m pip install "cdsapi>=0.7.7,<1"
      - name: download Q1 ${{ matrix.label }} temperature
        env:
          CDS_API_TOKEN: ${{ secrets.CDS_API_TOKEN }}
        run: >-
          python -m pipeline.era5_download_period
          --year ${{ inputs.year || '2020' }}
          --months 1 2 3
          --statistic ${{ matrix.statistic }}
          --output era5-land-q1-${{ inputs.year || '2020' }}-${{ matrix.slug }}.nc
      - name: upload Q1 ${{ matrix.label }} temperature
        uses: actions/upload-artifact@v4
        with:
          name: era5-land-q1-${{ inputs.year || '2020' }}-${{ matrix.slug }}
          path: era5-land-q1-${{ inputs.year || '2020' }}-${{ matrix.slug }}.nc
          if-no-files-found: error
          retention-days: 7
