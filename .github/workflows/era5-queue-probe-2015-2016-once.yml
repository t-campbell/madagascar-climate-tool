name: ERA5 queue probe 2015-2016 (one shot)

on:
  push:
    paths:
      - .github/workflows/era5-queue-probe-2015-2016-once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 2015-minimum
            request_id: 79306a79-eec6-4dbb-84b0-2762a75cb438
          - label: 2015-maximum
            request_id: 6ecd3791-e0b4-47f8-b31c-030b030e7ae3
          - label: 2016-minimum
            request_id: 9fdd5808-2b1c-428e-8ab9-98f64f37cd51
          - label: 2016-maximum
            request_id: 1fcd383a-d33f-438e-8586-aec9b74e4370
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "cdsapi>=0.7.7,<1"
      - name: Probe exact request
        env:
          CDS_API_TOKEN: ${{ secrets.CDS_API_TOKEN }}
          REQUEST_ID: ${{ matrix.request_id }}
        run: |
          python - <<'PY'
          import os
          from pipeline.era5_download_period import _api_token, _client
          request_id = os.environ["REQUEST_ID"]
          remote = _client(_api_token(None), wait_until_complete=False).client.get_remote(request_id)
          print(f"CDS_REQUEST_ID={request_id}")
          print(f"CDS_STATE={remote.status}")
          PY
