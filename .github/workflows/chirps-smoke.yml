name: CHIRPS live-source smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install geospatial reader
        run: python -m pip install "numpy>=2,<3" "rasterio>=1.4,<2"
      - name: read three validation locations
        run: >-
          python -m pipeline.chirps_smoke
          --date 2020-01-15
          --output chirps-smoke.json
      - name: validate JSON output
        run: python -m json.tool chirps-smoke.json
