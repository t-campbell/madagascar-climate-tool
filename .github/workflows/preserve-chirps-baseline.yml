name: preserve CHIRPS baseline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/preserve-chirps-baseline.yml]
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: download and verify baseline
        run: |
          gh run download 34862522613 -n chirps-1991-2020 -D baseline
          cd baseline
          echo "e03174e20c25a86d8ca106cadce5fa9ef12f58489bdf6c4a12b9a30787a48807  chirps-1991-2020.npz" | sha256sum -c -
          sha256sum chirps-1991-2020.npz chirps-1991-2020.json > SHA256SUMS
      - name: preserve versioned release
        run: |
          gh release view chirps-baseline-v1 >/dev/null 2>&1 || gh release create chirps-baseline-v1 --title "CHIRPS v3 1991–2020 baseline v1" --notes "Validated Madagascar CHIRPS v3 Final RNL baseline. Durable source for rainfall publication; native 0.05 degree grid."
          gh release upload chirps-baseline-v1 baseline/* --clobber
          gh release download chirps-baseline-v1 -D verify
          cd verify
          sha256sum -c SHA256SUMS
