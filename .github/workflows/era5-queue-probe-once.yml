name: ERA5 queue probe (one shot)

on:
  push:
    paths:
      - .github/workflows/era5-queue-probe-once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 2009-maximum
            request_id: b0ffb5d0-7d65-4cf9-b391-92a07688dd0b
          - label: 2010-minimum
            request_id: 4e926231-ef08-478a-a942-00691bec3693
          - label: 2010-maximum
            request_id: 8b7d0640-02e7-42c1-9673-e41191e646a3
          - label: 2011-minimum
            request_id: 8903e42d-76a2-4780-9152-938c8d9376db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "cdsapi>=0.7.7,<1"
      - name: Probe exact request
        env:
          CDS_API_TOKEN: ${{ secrets.CDS_API_TOKEN }}
          REQUEST_ID: ${{ matrix.request_id }}
        run: |
          python - <<'PY'
          import os
          from pipeline.era5_download_period import _api_token, _client
          request_id = os.environ["REQUEST_ID"]
          remote = _client(_api_token(None), wait_until_complete=False).client.get_remote(request_id)
          print(f"CDS_REQUEST_ID={request_id}")
          print(f"CDS_STATE={remote.status}")
          PY
