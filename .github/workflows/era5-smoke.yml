name: ERA5-Land live-source smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install ERA5-Land reader
        run: >-
          python -m pip install
          "cdsapi>=0.7.7,<1"
          "xarray>=2025.1,<2027"
          "netCDF4>=1.7,<2"
      - name: request and sample one live day
        env:
          CDS_API_TOKEN: ${{ secrets.CDS_API_TOKEN }}
        run: >-
          python -m pipeline.era5_smoke
          --date 2020-01-15
          --output era5-land-smoke.json
      - name: validate JSON output
        run: python -m json.tool era5-land-smoke.json
