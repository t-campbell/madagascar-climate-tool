name: CHIRPS Madagascar grid benchmark

on:
  workflow_dispatch:
    inputs:
      year:
        description: Complete CHIRPS Final year to reduce
        required: true
        default: "2020"
  push:
    branches: [main]
    paths:
      - ".github/workflows/chirps-grid-year.yml"
      - "pipeline/chirps_grid_year.py"

permissions:
  contents: read

jobs:
  national-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install geospatial reader
        run: python -m pip install "numpy>=2,<3" "rasterio>=1.4,<2"
      - name: reduce complete national grid
        run: >-
          python -m pipeline.chirps_grid_year
          --year ${{ inputs.year || '2020' }}
          --output /tmp/chirps-grid-year.npz
          --summary chirps-grid-summary.json
      - name: validate summary
        run: python -m json.tool chirps-grid-summary.json
