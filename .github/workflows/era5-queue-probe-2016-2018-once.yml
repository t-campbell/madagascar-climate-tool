name: ERA5 queue probe 2016-2018 (one shot)

on:
  push:
    paths:
      - .github/workflows/era5-queue-probe-2016-2018-once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 2016-maximum
            request_id: 1fcd383a-d33f-438e-8586-aec9b74e4370
          - label: 2017-minimum
            request_id: c9b05474-558a-4695-a4d8-e2c63edbadef
          - label: 2017-maximum
            request_id: a9e2a91f-6d95-4c0c-9a8a-483117c3838b
          - label: 2018-minimum
            request_id: 3be0457f-a55a-4104-9d22-b012c191eb2c
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "cdsapi>=0.7.7,<1"
      - name: Probe exact request
        env:
          CDS_API_TOKEN: ${{ secrets.CDS_API_TOKEN }}
          REQUEST_ID: ${{ matrix.request_id }}
        run: |
          python - <<'PY'
          import os
          from pipeline.era5_download_period import _api_token, _client
          request_id = os.environ["REQUEST_ID"]
          remote = _client(_api_token(None), wait_until_complete=False).client.get_remote(request_id)
          print(f"CDS_REQUEST_ID={request_id}")
          print(f"CDS_STATE={remote.status}")
          PY
